<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Augmented Chess</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --felt:#1f3d35; --felt-deep:#132822; --felt-lift:#2a4b41; --felt-line:#3c6356;
  --bone:#efe6d2; --bone-dim:#b9b09a; --brass:#d3a64d; --brass-deep:#9a7330;
  --maple:#e9d6ae; --walnut:#9e6a44; --frame:#3b2819; --danger:#e0685a; --ice:#a6dcf2;
  --ink:#1c1712;
  --font-display:"Alegreya SC","Palatino Linotype",Palatino,Georgia,serif;
  --font-body:"Alegreya Sans","Gill Sans","Segoe UI",system-ui,sans-serif;
  --font-piece:"Segoe UI Symbol","Noto Sans Symbols 2","Noto Sans Symbols","DejaVu Sans","Apple Symbols",serif;
  --sq:64px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{
  font-family:var(--font-body); font-size:17px; line-height:1.45; color:var(--bone);
  background:
    radial-gradient(ellipse 90% 60% at 50% -10%, #2d5448 0%, transparent 70%),
    radial-gradient(ellipse 70% 80% at 50% 120%, #0f211c 0%, transparent 70%),
    var(--felt);
  background-attachment:fixed;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0;letter-spacing:.01em}

/* ---------- Top bar ---------- */
.top{display:flex;align-items:center;gap:16px;padding:10px 20px;border-bottom:1px solid var(--felt-line);background:rgba(10,24,20,.35)}
.brand{font-family:var(--font-display);font-size:1.3rem;font-weight:700;display:flex;align-items:center;gap:10px}
.brand .mark{font-family:var(--font-piece);font-size:1.5rem;color:var(--brass);line-height:1}
.netstatus{margin-left:auto;font-size:.92rem;color:var(--bone-dim);display:flex;align-items:center;gap:8px}
.netstatus .dot{width:9px;height:9px;border-radius:50%;background:#6c7a73}
.netstatus.ok .dot{background:#7ed19a;box-shadow:0 0 0 3px rgba(126,209,154,.18)}
.netstatus.bad .dot{background:var(--danger)}

.sound{display:flex;align-items:center;gap:8px}
.iconbtn{background:none;border:1px solid var(--felt-line);border-radius:8px;width:36px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--bone);padding:0}
.iconbtn:hover{border-color:var(--brass)}
.iconbtn[aria-pressed=true]{color:var(--bone-dim)}
.sound input[type=range]{width:90px;accent-color:var(--brass);padding:0;background:none;border:0}
@media (max-width:600px){.sound input[type=range]{display:none}}

/* ---------- Buttons & fields ---------- */
.btn{appearance:none;border:1px solid var(--felt-line);background:var(--felt-lift);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){border-color:var(--brass);background:#31564a}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--brass);border-color:var(--brass);color:var(--ink);font-weight:700}
.btn.primary:hover:not(:disabled){background:#e2b75d}
.btn.ghost{background:transparent}
.btn.danger{border-color:#7a3b33}
.btn.small{padding:4px 10px;font-size:.9rem}
.btn.link{background:none;border:none;color:var(--brass);padding:4px 6px;text-decoration:underline;text-underline-offset:3px}
textarea,input[type=text],select{background:var(--felt-deep);border:1px solid var(--felt-line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:88px;resize:vertical;font-size:.78rem;line-height:1.3;word-break:break-all;font-family:var(--font-body)}
label{display:block}
.field{font-weight:500;color:var(--bone-dim);font-size:.95rem}
.field input,.field select{margin-top:4px;color:var(--bone)}

/* ---------- Foil cards (the one loud thing) ---------- */
.foil{
  --face:linear-gradient(135deg,#f5f7f9 0%,#c3cbd3 38%,#eef1f4 52%,#98a3ae 100%);
  --rim:#7c8793; --ink-c:#1d2429;
  position:relative;border-radius:16px;padding:14px 16px 16px;color:var(--ink-c);background:var(--face);
  border:1px solid var(--rim);box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 12px 28px rgba(0,0,0,.35);
  display:flex;flex-direction:column;gap:6px;overflow:hidden;isolation:isolate;
}
.foil::after{content:"";position:absolute;inset:6px;border-radius:11px;border:1px solid rgba(255,255,255,.55);pointer-events:none;z-index:-1}
.foil.tier-gold{--face:linear-gradient(135deg,#fff1c4 0%,#dcac43 40%,#f8e19a 54%,#a8761f 100%);--rim:#8d6419;--ink-c:#2a1b05}
.foil.tier-prismatic{
  --face:linear-gradient(115deg,#ffd9ea 0%,#d8e2ff 22%,#cff7ea 44%,#fff1c2 66%,#ecd6ff 88%,#ffd9ea 100%);
  --rim:#8f7bb5;--ink-c:#21182f;background:var(--face);background-size:220% 220%;
}
.foil.tier-prismatic::before{
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.65) 45%,transparent 60%);background-size:250% 100%;
  animation:sheen 6s ease-in-out infinite;
}
@keyframes sheen{0%{background-position:150% 0}55%,100%{background-position:-60% 0}}
.foil-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.foil-tier{font-family:var(--font-display);font-weight:700;font-size:.9rem;opacity:.75}
.foil-tags{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.tag{font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:999px;background:rgba(255,255,255,.55);border:1px solid rgba(0,0,0,.14)}
.tag-secret{background:#2a2135;color:#f1e9ff;border-color:#2a2135}
.tag-gamerule{background:#233a52;color:#e4f0ff;border-color:#233a52}
.tag-drawback{background:#5a2620;color:#ffe9e4;border-color:#5a2620}
.tag-quest{background:#294a2e;color:#e5ffe8;border-color:#294a2e}
.foil-icon{font-size:2.4rem;line-height:1;margin:6px 0 2px}
.foil-name{font-size:1.35rem;line-height:1.15}
.foil-desc{margin:0;font-size:.95rem;line-height:1.4;max-width:34ch}
.foil.back{justify-content:space-between}
.back-mark{font-family:var(--font-piece);font-size:7.5rem;line-height:1;text-align:center;opacity:.78;margin:6px 0}
.foil-foot{margin-top:auto;padding-top:10px;display:flex;gap:8px}
.foil .btn{color:var(--ink-c);background:rgba(255,255,255,.5);border-color:rgba(0,0,0,.25)}
.foil .btn:hover:not(:disabled){background:rgba(255,255,255,.8);border-color:rgba(0,0,0,.45)}
.foil .btn.primary{background:var(--ink-c);color:#fff;border-color:var(--ink-c)}
.foil .btn.primary:hover:not(:disabled){background:#000}

/* ---------- Lobby ---------- */
.lobby{max-width:1120px;margin:0 auto;padding:36px 24px 60px}
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:40px;align-items:center}
.fan{position:relative;height:340px}
.fan .foil{position:absolute;width:230px;height:300px;top:10px;left:50%;transform-origin:50% 120%}
.fan .foil:nth-child(1){transform:translateX(-50%) rotate(-14deg) translateX(-120px)}
.fan .foil:nth-child(2){transform:translateX(-50%) rotate(0deg);z-index:2}
.fan .foil:nth-child(3){transform:translateX(-50%) rotate(14deg) translateX(120px);z-index:3}
.hero h1{font-size:clamp(2.4rem,5vw,3.6rem);line-height:1.02;margin-bottom:14px}
.lede{font-size:1.2rem;max-width:36ch;margin:0 0 10px}
.fine{color:var(--bone-dim);max-width:44ch;margin:0}
.entry{margin-top:36px}
.entry>.field{max-width:320px;margin-bottom:18px}
.ways{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.way{background:rgba(12,28,23,.55);border:1px solid var(--felt-line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px}
.way h2{font-size:1.25rem}
.way p{margin:0;color:var(--bone-dim);font-size:.95rem}
.step{display:flex;flex-direction:column;gap:8px}
.steplabel{font-weight:700;font-size:.92rem;margin-top:6px}
.netmsg{font-size:.92rem;color:var(--bone-dim);margin:0}
.netmsg.err{color:#ffb4a8}

/* ---------- Tier picker (segmented) ---------- */
.seg{border:0;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:0;min-width:0}
.seg legend{font-weight:500;color:var(--bone-dim);font-size:.95rem;padding:0;margin-bottom:4px;width:100%}
.seg-opt{position:relative;flex:1 1 0;min-width:0}
.seg-opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg-opt span{display:block;text-align:center;padding:6px 4px;font-size:.88rem;font-weight:700;border:1px solid var(--felt-line);background:var(--felt-deep);color:var(--bone-dim);cursor:pointer;white-space:nowrap}
.seg-opt:first-of-type span{border-radius:8px 0 0 8px}
.seg-opt:last-of-type span{border-radius:0 8px 8px 0}
.seg-opt+.seg-opt span{border-left:0}
.seg-opt input:focus-visible+span{outline:2px solid var(--brass);outline-offset:1px;position:relative;z-index:1}
.seg-opt input:checked+span{color:var(--ink);border-color:transparent}
.seg-random input:checked+span{background:var(--bone)}
.seg-silver input:checked+span{background:linear-gradient(135deg,#f5f7f9,#a3aeb9)}
.seg-gold input:checked+span{background:linear-gradient(135deg,#fff0c0,#c99a33)}
.seg-prismatic input:checked+span{background:linear-gradient(115deg,#ffd9ea,#d8e2ff 35%,#cff7ea 65%,#fff1c2)}

/* ---------- Selection ---------- */
.select{max-width:1180px;margin:0 auto;padding:30px 24px 60px}
.select-head{display:flex;gap:18px;align-items:center;margin-bottom:26px}
.emblem{width:62px;height:62px;border-radius:50%;flex:none;border:2px solid rgba(0,0,0,.3);box-shadow:0 6px 18px rgba(0,0,0,.35)}
.emblem.tier-silver{background:linear-gradient(135deg,#fafbfc,#9aa5b0)}
.emblem.tier-gold{background:linear-gradient(135deg,#fff0bb,#b98522)}
.emblem.tier-prismatic{background:conic-gradient(#ffc4df,#c6d6ff,#c3f5e3,#fff0b3,#e4c8ff,#ffc4df)}
.select-head h1{font-size:2.1rem}
.select-head p{margin:2px 0 0;color:var(--bone-dim)}
.offer-row{margin-bottom:28px}
.offer-row h2{font-size:1.2rem;margin-bottom:12px}
.offers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.offers .foil{min-height:300px}
.offers .foil.chosen{outline:3px solid var(--brass);outline-offset:4px}
.offers.locked .foil:not(.chosen){opacity:.35;filter:saturate(.4)}
.deal{animation:deal .55s cubic-bezier(.2,.8,.2,1) both}
.offers .foil:nth-child(2).deal{animation-delay:.08s}
.offers .foil:nth-child(3).deal{animation-delay:.16s}
@keyframes deal{from{opacity:0;transform:translateY(24px) rotateY(80deg)}to{opacity:1;transform:none}}
.waiting{color:var(--bone-dim);font-size:1.02rem}

/* ---------- Game ---------- */
.game{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;max-width:1260px;margin:0 auto;padding:18px 20px 40px;align-items:start}
.boardcol{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.pbar{width:var(--bw,560px);max-width:100%;display:flex;align-items:center;gap:10px;min-height:44px}
.pbar .sw{width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.5);flex:none}
.pbar .sw.w{background:#f7f1e3}.pbar .sw.b{background:#231c24;border-color:#6b5f55}
.pbar .who{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbar .you{color:var(--bone-dim);font-weight:400}
.pbar .taken{font-family:var(--font-piece);font-size:1.05rem;letter-spacing:-1px;color:var(--bone-dim);overflow:hidden;white-space:nowrap}
.clock{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;font-size:1.35rem;padding:3px 12px;border-radius:8px;background:rgba(0,0,0,.25);border:1px solid transparent;min-width:92px;text-align:center}
.clock.run{background:var(--bone);color:var(--ink)}
.clock.low.run{background:var(--danger);color:#fff}
.clock .free{font-size:.7rem;font-weight:500;display:block;line-height:1}
.boardwrap{width:100%;display:flex;justify-content:center}
.board{
  width:min(100%,calc(100vh - 210px),720px);width:min(100%,calc(100dvh - 210px),720px);min-width:280px;aspect-ratio:1/1;
  display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
  border:12px solid var(--frame);border-radius:6px;box-shadow:0 0 0 2px var(--brass-deep),0 18px 40px rgba(0,0,0,.45);
  background:var(--frame);user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
.sq{position:relative;border:0;padding:0;margin:0;display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--maple);min-width:0;min-height:0}
.sq.d{background:var(--walnut)}
.sq.last::before{content:"";position:absolute;inset:0;background:rgba(242,196,80,.38)}
.sq.selected::before{content:"";position:absolute;inset:0;background:rgba(242,196,80,.6)}
.sq.pre::before{content:"";position:absolute;inset:0;background:rgba(58,112,214,.55)}
.sq.presel::before{content:"";position:absolute;inset:0;background:rgba(58,112,214,.7)}
.sq .predot{position:absolute;width:34%;height:34%;border-radius:50%;border:calc(var(--sq)*.05) solid rgba(38,74,140,.75);z-index:3;pointer-events:none}
.banner.pre{border-color:#5a86c8}
.sq.check::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(224,64,48,.95) 0%,rgba(224,64,48,.5) 45%,transparent 72%)}
.sq .coord{position:absolute;font-size:calc(var(--sq)*.17);font-weight:700;line-height:1;opacity:.75;pointer-events:none;z-index:5}
.sq .coord.rk{top:3px;left:4px}.sq .coord.fl{bottom:2px;right:4px}
.sq.l .coord{color:var(--walnut)}.sq.d .coord{color:var(--maple)}
.pc{position:relative;z-index:2;font-family:var(--font-piece);font-size:calc(var(--sq)*.8);line-height:1;pointer-events:none;font-variant-emoji:text}
.pc.w{color:#fbf6ea;-webkit-text-stroke:1.3px #2a1c10;text-shadow:0 2px 3px rgba(0,0,0,.35)}
.pc.b{color:#241b26;-webkit-text-stroke:.8px #e4d3b0;text-shadow:0 2px 3px rgba(0,0,0,.35)}
.pc.frozen{filter:drop-shadow(0 0 6px var(--ice)) saturate(.3)}
.badge{position:absolute;z-index:4;font-size:calc(var(--sq)*.24);line-height:1;pointer-events:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
.badge.tr{top:3px;right:3px}.badge.bl{bottom:3px;left:3px}.badge.tl{top:3px;left:3px}.badge.br{bottom:3px;right:3px}
.sq .dot{position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(28,23,18,.32);z-index:3;pointer-events:none}
.sq .ring{position:absolute;inset:5%;border-radius:50%;border:calc(var(--sq)*.07) solid rgba(28,23,18,.32);z-index:3;pointer-events:none}
.sq .tgt{position:absolute;inset:8%;border-radius:10px;border:3px solid var(--brass);box-shadow:0 0 0 2px rgba(0,0,0,.35),inset 0 0 12px rgba(211,166,77,.55);z-index:3;pointer-events:none}
.sq.area::before{content:"";position:absolute;inset:0;background:rgba(255,110,60,.45);z-index:1}
.sq .wall{position:absolute;inset:4%;z-index:2;border-radius:4px;pointer-events:none;
  background:repeating-linear-gradient(0deg,#6d6a63 0 22%,#4b4843 22% 25%),#5e5b55;box-shadow:inset 0 0 0 2px #3a3833,0 3px 6px rgba(0,0,0,.4)}
.sq .mine{position:absolute;z-index:1;font-size:calc(var(--sq)*.36);opacity:.55;pointer-events:none}
.banner{width:var(--bw,560px);max-width:100%;min-height:48px;display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:10px 14px;border-radius:10px;background:rgba(10,24,20,.55);border:1px solid var(--felt-line)}
.banner.alert{border-color:var(--danger)}
.banner.hot{border-color:var(--brass)}
.banner .msg{flex:1 1 220px}
.banner .picks{display:flex;flex-wrap:wrap;gap:6px}

.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:rgba(10,24,20,.5);border:1px solid var(--felt-line);border-radius:12px;padding:12px}
.panel>h2{font-size:1.05rem;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
.panel>h2 small{font-family:var(--font-body);font-weight:400;color:var(--bone-dim);font-size:.85rem}
.aug{display:grid;grid-template-columns:34px 1fr;gap:2px 10px;padding:10px 10px 10px 0;border-top:1px solid var(--felt-line);position:relative}
.aug:first-of-type{border-top:0}
.aug .ic{grid-row:span 3;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;border:1px solid rgba(0,0,0,.35)}
.aug.tier-silver .ic{background:linear-gradient(135deg,#f5f7f9,#98a3ae)}
.aug.tier-gold .ic{background:linear-gradient(135deg,#fff0c0,#b98522)}
.aug.tier-prismatic .ic{background:conic-gradient(#ffc4df,#c6d6ff,#c3f5e3,#fff0b3,#e4c8ff,#ffc4df)}
.aug .nm{font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.aug .nm .tag{font-size:.66rem;color:var(--ink);background:var(--bone-dim);border-color:transparent}
.aug .nm .tag-secret{background:#3d3150;color:#efe6ff}
.aug .d{margin:0;font-size:.9rem;color:#d9d0bb;line-height:1.35}
.aug .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.85rem;color:var(--bone-dim);margin-top:4px}
.aug .qbar{width:110px;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.aug .qbar i{display:block;height:100%;background:var(--brass)}
.aug .done{color:#9fe0af;font-weight:700}
.aug.hiddenaug .ic{background:#2a2135;color:#e9dcff}
.aug.used{opacity:.6}
.tabs{display:flex;gap:4px;margin-bottom:8px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:4px 10px;cursor:pointer;color:var(--bone-dim);font-weight:700}
.tabs button[aria-selected=true]{color:var(--bone);border-bottom-color:var(--brass)}
.tabbody{max-height:250px;overflow:auto;font-size:.9rem;display:flex;flex-direction:column;gap:4px;padding-right:4px}
.ev{margin:0;color:#d9d0bb}
.ev.priv{color:#d8c8ff}
.mvrow{display:grid;grid-template-columns:32px 1fr 1fr;gap:6px;font-variant-numeric:tabular-nums}
.mvrow span:first-child{color:var(--bone-dim)}
.chatrow{display:flex;gap:6px;margin-top:8px}
.chatrow input{flex:1}
.chatmsg b{color:var(--brass)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.controls label{display:flex;align-items:center;gap:6px;font-size:.9rem;color:var(--bone-dim)}

/* ---------- Scope badges & tooltip ---------- */
.scope{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;padding:1px 8px 1px 6px;border-radius:999px;border:1px solid transparent;cursor:help;white-space:nowrap;line-height:1.5;vertical-align:middle}
.scope svg{width:12px;height:12px;flex:none}
.scope-you{background:#1d4b57;color:#def5fa;border-color:#3b7482}
.scope-them{background:#6a2a22;color:#ffe8e2;border-color:#96463b}
.scope-both{background:#48336e;color:#efe6ff;border-color:#6d56a0}
.scope.rule{box-shadow:0 0 0 2px rgba(211,166,77,.85)}
.foil-scope{display:flex}
.tip{position:fixed;z-index:80;max-width:280px;padding:8px 11px;border-radius:8px;background:#0e1d19;color:var(--bone);border:1px solid var(--brass);font-size:.86rem;line-height:1.35;box-shadow:0 10px 24px rgba(0,0,0,.45);pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 12px}
.legend .fine{font-size:.85rem}
.browse{margin-top:16px}
.fine.small{font-size:.85rem;margin-top:6px}
.codex-tabs{display:flex;gap:8px;margin:6px 0 10px;flex-wrap:wrap}
.codex-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chipbtn{border:1px solid var(--felt-line);background:transparent;border-radius:999px;padding:3px 11px;cursor:pointer;font-size:.85rem;color:var(--bone-dim)}
.chipbtn:hover{border-color:var(--brass)}
.chipbtn.on{background:var(--bone);color:var(--ink);border-color:var(--bone)}
.codex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.codex-grid .foil{min-height:220px}
.codex-grid .foil-icon{font-size:1.8rem}

.modal-bg{position:fixed;inset:0;background:rgba(5,12,10,.7);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}

/* ===================== Expansion: ten more per tier ===================== */
function spawnPawns(S, c, n, fromLost) {
  const walls = new Set(S.marks.filter(m => m.k === 'wall' && S.ply <= m.until).map(m => m.sq));
  const sqs = shuffle([...Array(64).keys()].filter(i => rel(c, R(i)) === 1 && !S.board[i] && !walls.has(i)));
  const out = [];
  for (const i of sqs) {
    if (out.length >= n) break;
    if (fromLost) { const k = S.lost[c].indexOf('p'); if (k < 0) break; S.lost[c].splice(k, 1); }
    S.board[i] = { id: S.nid++, t: 'p', c, moved: true }; out.push(i);
  }
  return out;
}
function pawnChecks(S, c) {
  const k = kingSq(S.board, opp(c)); if (k < 0) return false; const ctx = mkCtx(S);
  for (const i of pieces(S, c, 'p')) { const p = S.board[i]; if (isFrozen(S, p)) continue; const out = []; genPiece(ctx, S.board, i, p, out); if (out.some(m => m.cap === k)) return true; }
  return false;
}
function trapFreeze(S, p) { p.fzf = S.ply + 1; p.fz = S.ply + 4; delete p.fzk; }
function hideOnOwnPawn(S, c, tag, label) {
  const ps = pieces(S, c, 'p'); if (!ps.length) return; const i = rnd(ps); S.board[i][tag] = c;
  log(S, `Your ${label} is the pawn on ${sqName(i)}.`, c);
}
const AGENDA = { rooks: 'destroy two enemy rooks', bishops: 'destroy two enemy bishops', knight: 'land a knight on the enemy back rank', pawncheck: 'give check with a pawn' };

function scopeInfo(d, mine) {

H.chat = () => {
  const inp = $('#chatIn'), t = inp.value.trim(); if (!t) return;
  const from = App.name || (App.mode === 'host' ? 'Host' : 'Guest');
  send({ type: 'chat', from, text: t }); App.chat.push({ from, text: t }); inp.value = ''; renderTabs();
};
H.sound = () => { Sfx.unlock(); Sfx.setMuted(!Sfx.muted); if (!Sfx.muted && Sfx.vol === 0) Sfx.setVol(0.6); renderSound(); Sfx.play('move'); };
H.codex = () => { if (App.S) return; UI.modal = 'codex'; renderModal(); };
H.codexTier = b => { UI.codexTier = b.dataset.tier; renderModal(); };
H.codexTag = b => { UI.codexTag = b.dataset.tag; renderModal(); };
H.leave = () => { closePeer(); App.mode = null; App.S = null; App.chat = []; UI.modal = null; render(); };
H.closeModal = () => { UI.modal = null; if (App.S && App.S.phase === 'over') UI.overShown = overKey(); renderModal(); };

/* ---------- Modals ---------- */
function overKey() { const S = App.S; return S ? S.hostColor + S.tier + S.log.length + (S.result && S.result.reason) : ''; }
function renderModal() {
  const root = $('#modal'), S = App.S;
  if (S && UI.modal === 'codex') UI.modal = null;
  Tip.hide();
  if (!UI.modal && S && S.phase === 'over' && UI.screen === 'game' && UI.overShown !== overKey()) UI.modal = 'over';
  if (!UI.modal) { root.innerHTML = ''; return; }
  let h = '';
  if (UI.modal === 'promo' && UI.promo) {
    h = `<div class="modal" role="dialog" aria-label="Choose promotion"><h2>Promote your pawn</h2><div class="promo-opts">${['q', 'r', 'b', 'n'].map(t => `<button data-act="promo" data-p="${t}" aria-label="${PN[t]}">${glyph(t, UI.promo.c)}</button>`).join('')}</div></div>`;
  } else if (UI.modal === 'over' && S && S.result) {
    const win = S.result.winner;
    const head = !win ? 'Draw' : App.mode === 'local' ? `${CN[win]} wins` : (win === App.me ? 'You win' : 'You lose');
    h = `<div class="modal" role="dialog" aria-label="Game over"><h2>${head}</h2><p>${esc(reasonText(S.result))}</p>
      <div class="row"><button class="btn" data-act="closeModal">Review the board</button>${App.mode === 'local' || App.connected ? '<button class="btn primary" data-act="rematch">Rematch</button>' : ''}</div></div>`;
  } else if (UI.modal === 'codex' && !S) {
    const TAGS = ['All', 'Passive', 'Active', 'Drawback', 'Quest', 'Secret', 'Gamerule', 'Wildcard', 'Clock'];
    const inTier = AUGS.filter(d => d.tier === UI.codexTier && !d.reward);
    const list = inTier.filter(d => UI.codexTag === 'All' || d.tags.includes(UI.codexTag));
    const rewards = AUGS.filter(d => d.reward && d.tier === UI.codexTier);
    h = `<div class="modal wide" role="dialog" aria-label="All augments">
      <div class="row" style="justify-content:space-between;align-items:center"><h2>All augments</h2><button class="btn" data-act="closeModal">Close</button></div>
      <p>Every augment that can be offered in a draft. This list closes once a game starts.</p>
      <div class="legend">${['self', 'opp', 'both'].map(sc => scopeChip({ scope: sc, tags: [] }, true)).join('')}<span class="fine">Hover or tap a badge to see exactly who an augment applies to.</span></div>
      <div class="codex-tabs" role="tablist">${E.TIERS.map(t => `<button class="btn ${t === UI.codexTier ? 'primary' : ''}" role="tab" aria-selected="${t === UI.codexTier}" data-act="codexTier" data-tier="${t}">${TIER_NAME[t]} (${AUGS.filter(d => d.tier === t && !d.reward).length})</button>`).join('')}</div>
      <div class="codex-tags">${TAGS.map(t => `<button class="chipbtn ${t === UI.codexTag ? 'on' : ''}" aria-pressed="${t === UI.codexTag}" data-act="codexTag" data-tag="${t}">${t}${t === 'All' ? '' : ` ${inTier.filter(d => d.tags.includes(t)).length}`}</button>`).join('')}</div>
      <div class="codex-grid">${list.length ? list.map(d => foilCard(d)).join('') : '<p class="fine">None in this tier.</p>'}</div>
      ${rewards.length && UI.codexTag === 'All' ? `<h3 class="codex-sub">Quest rewards in this tier</h3><div class="codex-grid">${rewards.map(d => foilCard(d)).join('')}</div>` : ''}</div>`;
  } else { UI.modal = null; root.innerHTML = ''; return; }
  root.innerHTML = `<div class="modal-bg" data-act="bg">${h}</div>`;
}
H.bg = (el, e) => { if (e.target === el && UI.modal !== 'promo') H.closeModal(); };

/* ===================== Wiring ===================== */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const k = t.dataset.act; if (k === 'autoflip' || k === 'premoveToggle') return; if (H[k]) H[k](t, e);
});
document.addEventListener('change', e => {
  const t = e.target.closest('[data-act="autoflip"]'); if (t) H.autoflip(t);
  const q = e.target.closest('[data-act="premoveToggle"]'); if (q) H.premoveToggle(q);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (UI.targ) { UI.targ = null; render(); } else if (UI.pre || UI.psel != null) { cancelPremove(); render(); } else if (UI.sel != null) { UI.sel = null; render(); } else if (UI.modal && UI.modal !== 'promo') H.closeModal();
});
window.addEventListener('beforeunload', e => { if (App.S && App.S.phase !== 'over' && App.mode !== 'local') { e.preventDefault(); e.returnValue = ''; } });
setInterval(() => {
  const S = App.S; if (!S) return;
  if (isHost() && E.tickClock(S)) { S.v++; afterHost(); return; }
  updateClocks();
}, 200);
if (typeof RTCPeerConnection === 'undefined') toast('This browser doesn’t support WebRTC, so only practice mode will work.');
document.addEventListener('pointerdown', () => Sfx.unlock(), true);
document.addEventListener('keydown', () => Sfx.unlock(), true);
$('#sndVol').addEventListener('input', e => { Sfx.setVol(e.target.value / 100); if (Sfx.muted && Sfx.vol > 0) Sfx.setMuted(false); renderSound(); });
$('#sndVol').addEventListener('change', () => Sfx.play('move'));
renderSound();
render();
})();

</script>
</body>
</html>
